# Processa áudio no GitHub Actions: /info (detalhado), /capa, /limpar, /renomear, /tag
# (arquivos acima de 20 MB) e /converter, /cortar, /normalizar, /juntar, /espectro e /yt (yt-dlp).
# O Worker dispara este workflow por repository_dispatch (event_type "audio-tool").
#
# Secrets do repositório (Settings > Secrets and variables > Actions):
#   BOT_TOKEN    -> o token do bot (o mesmo do Worker)
#   TG_API_ID    -> api_id de https://my.telegram.org (API development tools)
#   TG_API_HASH  -> api_hash do mesmo lugar
# TG_API_ID/TG_API_HASH só são usados para arquivos acima de 20 MB: o limite de download
# da Bot API é 20 MB para qualquer cliente HTTP (Worker ou Actions), então o script baixa
# (e, acima de 50 MB, envia) por MTProto, logando o próprio bot.
#
#   YT_COOKIES   -> (opcional, /yt) conteúdo de um cookies.txt do YouTube, formato Netscape.
#                   Sem ele o YouTube costuma bloquear o IP do GitHub Actions.
#   YT_PROXIES   -> (opcional, /yt pais=xx) JSON {"nz": "socks5://user:senha@host:porta"}.
#                   Proxy/VPN que sai no país escolhido: é o que realmente contorna bloqueio regional.
#   YT_BRAND     -> (opcional, /yt marca) texto da marca gravado nas tags e no nome do arquivo.
#   YT_BRAND_URL -> (opcional, /yt marca) link gravado na tag "TELEGRAM URL".
#
# No Worker: GITHUB_TOKEN (PAT, escopo repo) e GITHUB_REPO ("usuario/repositorio").

name: audio-tools

on:
  repository_dispatch:
    types: [audio-tool]

jobs:
  process:
    # Versão fixa: o "ubuntu-latest" passou a apontar para o Ubuntu 26.04, cujos espelhos
    # do apt falharam com "Temporary failure resolving" (runs #167, #169 e #170).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                                   # reaproveita os pacotes entre execuções
          cache-dependency-path: scripts/requirements.txt

      - name: Instala dependências Python
        run: pip install -r scripts/requirements.txt

      # ffmpeg estático: um download só, sem o "apt-get update" + dezenas de pacotes de antes
      - uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ github.token }}

      # exiftool só é usado no /info detalhado. Instalado direto do GitHub (Perl já vem no runner),
      # sem apt: o apt-get update ficava 3 min preso nos espelhos do Ubuntu (runs #167 a #172).
      # Se falhar, o job segue sem ele (o scripts/audio_tools.py tolera a ausência).
      - name: Instala exiftool (só no /info)
        if: github.event.client_payload.op == 'info'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -e
          mkdir -p "$HOME/exiftool"
          curl -fsSL --retry 3 --max-time 60 https://github.com/exiftool/exiftool/archive/refs/tags/13.50.tar.gz -o /tmp/exiftool.tgz \
            || curl -fsSL --retry 3 --max-time 60 https://github.com/exiftool/exiftool/archive/refs/heads/master.tar.gz -o /tmp/exiftool.tgz
          tar -xzf /tmp/exiftool.tgz -C "$HOME/exiftool" --strip-components=1
          printf '#!/bin/sh\nexec perl "%s/exiftool/exiftool" "$@"\n' "$HOME" | sudo tee /usr/local/bin/exiftool >/dev/null
          sudo chmod +x /usr/local/bin/exiftool
          exiftool -ver

      - name: Processa o áudio
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          YT_PROXIES: ${{ secrets.YT_PROXIES }}
          YT_BRAND: ${{ secrets.YT_BRAND }}
          YT_BRAND_URL: ${{ secrets.YT_BRAND_URL }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: python scripts/audio_tools.py
