name: uploader

on:
  repository_dispatch:
    types: [uploader]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --disable-pip-version-check requests kurigram tgcrypto

      - name: Instalar FFmpeg (só se precisar de probe/thumb)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg p7zip-full unzip

      - name: Executar uploader
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_PREMIUM_SESSION: ${{ secrets.TG_PREMIUM_SESSION }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: python scripts/uploader.py

      - name: Avisar falha
        if: failure()
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ github.event.client_payload.chat_id }}
          TG_THREAD_ID: ${{ github.event.client_payload.thread_id }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token, chat = os.getenv("BOT_TOKEN"), os.getenv("TG_CHAT_ID")
          if token and chat:
              data = {"chat_id": chat, "text": "❌ /uploader falhou. Log: " + os.getenv("GH_RUN_URL", ""), "disable_web_page_preview": True}
              if os.getenv("TG_THREAD_ID"):
                  data["message_thread_id"] = int(os.environ["TG_THREAD_ID"])
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage",
                  data=json.dumps(data).encode(), headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req, timeout=20)
          PY
