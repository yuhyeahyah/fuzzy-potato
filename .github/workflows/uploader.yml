# .github/workflows/uploader.yml   (o script fica em scripts/uploader.py)
name: uploader

on:
  repository_dispatch:
    types: [uploader]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Mask capabilities before any step displays PAYLOAD in its environment.
      - name: Mascarar tokens e links privados nos logs
        run: |
          python - <<'PYMASK'
          import json, os
          from urllib.parse import urlsplit, parse_qsl
          p = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8")).get("client_payload", {})
          secrets = []
          token = (p.get("cb") or {}).get("token")
          if token:
              secrets.append(str(token))
          items = p.get("items") or [{"url": p.get("url", "")}]
          for item in items:
              if not isinstance(item, dict) or not isinstance(item.get("url"), str):
                  continue
              u = item["url"]
              secrets.append(u)
              try:
                  parts = urlsplit(u)
                  if parts.fragment:
                      secrets.append(parts.fragment)
                  secrets.extend(value for key, value in parse_qsl(parts.query) if key in ("t", "v", "authkey", "redeem") and value)
              except ValueError:
                  pass
          for value in dict.fromkeys(secrets):
              escaped = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::add-mask::" + escaped)
          PYMASK

      - name: Instalar dependências
        run: |
          python -m pip install --disable-pip-version-check requests kurigram tgcrypto pycryptodome "playwright>=1.50,<2"

      - name: Detectar hosts que usam navegador
        id: browser
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          python - <<'PYCODE'
          import json, os
          from scripts.onedrive_resolver import clean_url, is_onedrive_url, is_direct_url
          from scripts.webhost_resolver import needs_browser
          p = json.loads(os.environ["PAYLOAD"])
          items = p.get("items") or [{"url": p.get("url", "")}]
          needed = any(isinstance(i, dict) and i.get("url") and
                       ((is_onedrive_url(clean_url(i["url"])) and not is_direct_url(clean_url(i["url"])))
                        or needs_browser(i["url"]))
                       for i in items)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("needed=" + str(bool(needed)).lower() + "\n")
          PYCODE

      # Chromium completo: o resolvedor usa channel="chromium" (new headless).
      - name: Instalar Chromium para OneDrive, Send e BuzzHeavier
        if: steps.browser.outputs.needed == 'true'
        timeout-minutes: 6
        run: python -m playwright install --with-deps chromium

      # 7z só é preciso para .rar/.7z; ZIP e partes .zip.001 funcionam sem ele.
      # O apt do runner já travou em outros workflows, então não derruba o job se falhar.
      - name: 7z para RAR/7z (opcional)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if command -v 7z >/dev/null || command -v 7zz >/dev/null || command -v 7za >/dev/null; then
            echo "7z já instalado"
          else
            sudo apt-get -o Acquire::Retries=2 update -qq
            sudo apt-get install -y --no-install-recommends p7zip-full
          fi

      - name: Executar uploader
        env:
          PYTHONUNBUFFERED: "1"
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_PREMIUM_SESSION: ${{ secrets.TG_PREMIUM_SESSION }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: python scripts/uploader.py

      - name: Avisar falha do workflow
        if: ${{ failure() }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ github.event.client_payload.chat_id }}
          TG_THREAD_ID: ${{ github.event.client_payload.thread_id }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token, chat = os.getenv("BOT_TOKEN"), os.getenv("TG_CHAT_ID")
          if token and chat:
              data = {
                  "chat_id": chat,
                  "text": "❌ /uploader falhou. Log: " + os.getenv("GH_RUN_URL", ""),
                  "disable_web_page_preview": True,
              }
              if os.getenv("TG_THREAD_ID"):
                  data["message_thread_id"] = int(os.environ["TG_THREAD_ID"])
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=json.dumps(data).encode(),
                  headers={"Content-Type": "application/json"},
              )
              urllib.request.urlopen(req, timeout=20)
          PY
