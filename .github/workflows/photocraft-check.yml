name: photocraft-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Dependencies for adapter tests
        run: python -m pip install 'pillow>=11,<13' 'requests>=2.32,<3'
      - name: Adapter tests (NOT native rendering)
        run: python -m unittest discover -s tests -p 'test_photocraft.py' -v
      - name: Worker tests (mock Telegram and KV)
        run: node --test tests/worker.test.cjs
      - name: Install pinned PhotoCraft
        run: python scripts/install_photocraft.py --dir "$RUNNER_TEMP/photocraft"
      - name: Native graphics tests
        run: python scripts/photocraft_native_tests.py --out photocraft-native-results
      - name: Native evidence (synthetic test data only)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: photocraft-native-results
          path: photocraft-native-results
          if-no-files-found: warn
          retention-days: 7
