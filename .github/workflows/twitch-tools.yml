name: twitch-tools

on:
  repository_dispatch:
    types: [twitch-tool]

permissions:
  contents: read

jobs:
  twitch:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Conferir código do repositório
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar FFmpeg (glibc dinâmica, resolve DNS)
        timeout-minutes: 5
        run: |
          set -e
          URL=https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          if curl -fsSL --retry 3 --max-time 120 "$URL" -o /tmp/ff.tar.xz; then
            mkdir -p /tmp/ff
            tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            sudo install -m 755 /tmp/ff/bin/ffmpeg /tmp/ff/bin/ffprobe /usr/local/bin/
          else
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          hash -r
          which ffmpeg && ffmpeg -hide_banner -version | head -1
          # Teste de rede: um ffmpeg quebrado dá segfault (139) ao resolver DNS
          set +e
          ffprobe -v error -i https://github.com/ >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 139 ]; then echo "::error::ffprobe segfault em HTTPS"; exit 1; fi
          echo "ffprobe HTTPS ok (rc=$rc; erro de formato é esperado, segfault não)"

      - name: Instalar VODRecovery e dependências
        run: |
          git clone --depth 1 https://github.com/MacielG1/VodRecovery.git /tmp/vodrecovery
          python -m pip install --disable-pip-version-check -r /tmp/vodrecovery/lib/requirements.txt kurigram tgcrypto

      - name: Recuperar VOD e enviar ao Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          # Opcional: sessao de uma CONTA DE USUARIO Telegram Premium, nao do bot.
          TG_PREMIUM_SESSION: ${{ secrets.TG_PREMIUM_SESSION }}
          VODRECOVERY_SCRIPT: /tmp/vodrecovery/vod_recovery.py
          VODRECOVERY_CONFIG: /tmp/vodrecovery/config/settings.json
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          python scripts/twitch_recovery.py

      # Se a instalação falhar antes do Python iniciar, avisa no Telegram.
      - name: Avisar falha do workflow
        if: ${{ failure() }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ github.event.client_payload.chat_id }}
          TG_THREAD_ID: ${{ github.event.client_payload.thread_id }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token, chat = os.getenv('BOT_TOKEN'), os.getenv('TG_CHAT_ID')
          if not token or not chat:
              print('Token ou chat ausente; impossível enviar aviso. Confira os secrets do repositório.')
          else:
              data = {
                  'chat_id': chat,
                  'text': '❌ /twitch: o GitHub Actions falhou. Veja o log da execução: ' + os.getenv('GH_RUN_URL', ''),
                  'disable_web_page_preview': True,
              }
              if os.getenv('TG_THREAD_ID'):
                  data['message_thread_id'] = int(os.environ['TG_THREAD_ID'])
              req = urllib.request.Request('https://api.telegram.org/bot' + token + '/sendMessage',
                  data=json.dumps(data).encode('utf-8'),
                  headers={'Content-Type': 'application/json'}, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      print('Notificação enviada:', r.status)
              except Exception as e:
                  print('Não consegui enviar notificação ao Telegram:', e)
          PY
